<p><noscript>it honestly would have been pretty easy to make this work without javascript probably but im lazy so u need javascript to see the sitemap. sorry <code>&gt;.&lt;</code></noscript></p>
<ul id="sitemapoutput"></ul>
<script>
  fetch("/sitemap.json")
    .then(r => r.json())
    .then(sitemap_loaded)
  let sitemap
  let folderstructure
  function sitemap_loaded(s) {
    console.log("loaded sitemap!")
    sitemap = s
    folderstructure = {"/": {}}
    console.log(sitemap)
    for (let file of sitemap) {
      let components = file.Path.split("/")
      components = components.filter(x => x != "")
      console.log(components)
      for (let i = 0; i < components.length; i++) {
        let folder = folderstructure["/"]
        for (let j = 0; j < i; j++) {
          if (!folder.hasOwnProperty(components[j])) {
            folder[components[j]] = {}
          }
          folder = folder[components[j]]
        }
        if (i == components.length-1) {
          folder[components[i]] = true
        }
      }
    }
    showfiles(folderstructure, sitemapoutput, "")
  }
  function showfiles(tree, elt, path) {
    for (let filename in tree) {
      if (filename == "index.md") continue
      let li = document.createElement("li")
      let isfolder = tree[filename] !== true
      let nicename = filename.replace(/\.md$/, "").replace("_", " ")
      li.innerHTML = `<a href="${path}${filename.replace(/\.md$/, ".html")}"><img src="/_theme/${isfolder ? "folder" : "document"}.png" class=fileicon> ${nicename}</a>`
      elt.append(li)
      if (isfolder) {
        let ul = document.createElement("ul")
        li.append(ul)
        showfiles(tree[filename], ul, path+filename+(path ? "/" : ""))
      }
    }
  }
</script>
